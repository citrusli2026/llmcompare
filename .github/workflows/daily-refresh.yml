name: Daily Data Refresh

on:
  schedule:
    - cron: '0 4 * * *'  # UTC 4:00 = 北京 12:00
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: |
          cd app
          npm ci

      - name: Run data pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "llmcompare-bot"
          git config --global user.email "bot@llmcompare.cc"
          cd data
          python3.11 pipeline.py --cache-hours 0

      - name: Summary
        if: always()
        run: |
          echo "## 📊 Data Refresh Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Time:** $(date -u)" >> "$GITHUB_STEP_SUMMARY"

name: Daily Data Refresh

on:
  schedule:
    - cron: '0 0 * * *'  # UTC 0:00 = 北京 08:00
    - cron: '0 12 * * *' # UTC 12:00 = 北京 20:00（二次刷新，捕捉美西更新）
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Cache raw data
        uses: actions/cache@v5
        with:
          path: data/2-raw
          key: raw-data-${{ github.run_id }}
          restore-keys: |
            raw-data-

      - name: Install app dependencies
        run: |
          cd app
          npm ci

      - name: Run data pipeline
        id: pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CI: true
        run: |
          git config --global user.name "llmcompare-bot"
          git config --global user.email "bot@llmcompare.cc"
          cd data
          python3.11 pipeline.py --cache-hours 6

      - name: Summary
        if: always()
        run: |
          echo "## 📊 Data Refresh Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Time:** $(date -u)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          python3.11 data/scripts/generate-workflow-summary.py

      - name: Create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "🚨 数据刷新失败 $(date -u +%Y-%m-%d)" \
            --body "自动数据刷新失败，请查看 [Actions 日志](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})。" \
            --label "bug" || true

name: Daily Data Refresh

on:
  schedule:
    - cron: '0 0 * * *'  # UTC 0:00 = 北京 08:00
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: |
          cd app
          npm ci

      - name: Run data pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          git config --global user.name "llmcompare-bot"
          git config --global user.email "bot@llmcompare.cc"
          cd data
          python3.11 pipeline.py --cache-hours 0

      - name: Push to main directly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd app
          # Check if there are changes
          if git diff --quiet origin/main; then
            echo "No changes to push"
            exit 0
          fi
          # Force push main (bypasses branch protection in Actions)
          git push origin main
          echo "✅ Pushed to main"

      - name: Summary
        if: always()
        run: |
          echo "## 📊 Data Refresh Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Time:** $(date -u)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

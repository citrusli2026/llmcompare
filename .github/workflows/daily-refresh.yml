name: Daily Data Refresh

on:
  schedule:
    # ── 定时任务说明 ─────────────────────────────────────────────
    # · cron 一律按 UTC 解释（GitHub 文档明确，最常见的踩坑点）
    # · 换算公式: cron(UTC) = 北京时间 − 8h（如北京 04:00 → UTC 前一日 20:00）
    # · 最短触发间隔 5 分钟；不保证准时，高峰可能延迟数十分钟（实测 39 分钟）
    # · 公开仓库 Actions 分钟数不限，无需担心跑超
    # · 管线实测约 10-20 分钟（workflow 超时上限 30 分钟），提前 2 小时开跑，
    #   确保北京 07:00 前数据就绪；北京凌晨 = 美国白天（Actions 较忙），
    #   故留足延迟余量
    # ─────────────────────────────────────────────────────────────
    - cron: '0 18 * * *'  # UTC 18:00(前一日) = 北京 02:00 — 主刷新，兜底美国隔夜更新
    - cron: '0 20 * * *'  # UTC 20:00(前一日) = 北京 04:00 — 二次刷新，兜底美西午间发布(美西 12-13 点)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # validate-data.py 需要 HEAD~1 对比历史数据

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Python dependencies
        run: |
          pip install jsonschema

      - name: Cache raw data
        uses: actions/cache@v5
        with:
          path: data/2-raw
          key: raw-data-v2
          restore-keys: |
            raw-data-

      - name: Install app dependencies
        run: |
          cd app
          npm ci

      - name: Run data pipeline
        id: pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CI: true
        run: |
          git config --global user.name "llmcompare-bot"
          git config --global user.email "bot@llmcompare.cc"
          cd data
          python3.11 pipeline.py --cache-hours 6

      - name: Summary
        if: always()
        run: |
          echo "## 📊 Data Refresh Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Time:** $(date -u)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          python3.11 data/scripts/generate-workflow-summary.py

      # 数据源降级(缓存兜底)不阻断管线, 但会让站点展示陈旧/不完整数据。
      # 降级状态只写在 ranking-meta.json, 无人消费 → 开 issue 使其可见 (去重, 每日一条)。
      - name: Alert on degraded data sources
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEGRADED_INFO=$(python3.11 -c "
          import json, sys
          try:
              meta = json.load(open('app/src/data/ranking-meta.json'))
          except Exception:
              sys.exit(0)
          parts = []
          for k, v in meta.get('sources', {}).items():
              if v.get('degraded'):
                  parts.append(f\"{k} 降级: {str(v.get('error'))[:150]}\")
              elif v.get('cached') and not v.get('ok'):
                  parts.append(f\"{k} 使用缓存\")
          if meta.get('partial_update'):
              parts.append('部分更新 partial_update=true')
          print('; '.join(parts))
          " || true)
          if [ -n "$DEGRADED_INFO" ]; then
            TITLE="⚠️ 数据刷新降级告警 $(date -u +%Y-%m-%d)"
            RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            BODY="本次刷新存在数据源降级：**$DEGRADED_INFO**

            降级期间站点可能展示缓存或缺失数据，详情见 [Actions 日志]($RUN_URL)。"
            ISSUE_NUMBER=$(gh issue list --state open --search "$TITLE" --json number,title \
              --jq '.[] | select(.title == "'"$TITLE"'") | .number' | head -n 1)
            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue comment "$ISSUE_NUMBER" --body "$BODY" || true
            else
              gh issue create --title "$TITLE" --body "$BODY" --label "bug" || true
            fi
          fi

      - name: Close degraded alert issues when healthy
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEGRADED_INFO=$(python3.11 -c "
          import json, sys
          try:
              meta = json.load(open('app/src/data/ranking-meta.json'))
          except Exception:
              sys.exit(0)
          parts = []
          for k, v in meta.get('sources', {}).items():
              if v.get('degraded'):
                  parts.append(k)
          if meta.get('partial_update'):
              parts.append('partial_update')
          print('; '.join(parts))
          " || true)
          if [ -z "$DEGRADED_INFO" ]; then
            ISSUES=$(gh issue list --state open --search "数据刷新降级告警" --json number,title \
              --jq '.[] | select(.title | contains("数据刷新降级告警")) | .number')
            for ISSUE_NUMBER in $ISSUES; do
              gh issue comment "$ISSUE_NUMBER" \
                --body "数据源已恢复正常（[Actions 日志](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})），自动关闭。" || true
              gh issue close "$ISSUE_NUMBER" || true
            done
          fi

      - name: Create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🚨 数据刷新失败 $(date -u +%Y-%m-%d)"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # 去重：已有同标题 open issue 则改为评论追加，避免连开重复 issue
          ISSUE_NUMBER=$(gh issue list --state open --search "$TITLE" --json number,title \
            --jq '.[] | select(.title == "'"$TITLE"'") | .number' | head -n 1)
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" \
              --body "再次失败，请查看 [Actions 日志]($RUN_URL)。" || true
          else
            gh issue create \
              --title "$TITLE" \
              --body "自动数据刷新失败，请查看 [Actions 日志]($RUN_URL)。" \
              --label "bug" || true
          fi

      - name: Close stale failure issues on success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 刷新成功后，自动关闭仍 open 的"数据刷新失败" issue
          ISSUES=$(gh issue list --state open --search "数据刷新失败" --json number,title \
            --jq '.[] | select(.title | contains("数据刷新失败")) | .number')
          for ISSUE_NUMBER in $ISSUES; do
            gh issue comment "$ISSUE_NUMBER" \
              --body "数据刷新已恢复（[Actions 日志](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})），自动关闭。" || true
            gh issue close "$ISSUE_NUMBER" || true
          done

name: Daily Data Refresh

on:
  schedule:
    - cron: '0 4 * * *'  # UTC 4:00 = 北京 12:00
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: |
          cd app
          npm ci

      - name: Run data pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "llmcompare-bot"
          git config --global user.email "bot@llmcompare.cc"
          cd data
          python3.11 pipeline.py --cache-hours 0

      - name: Auto-approve and merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the latest open PR from llmcompare-bot
          PR_URL=$(gh pr list --state open --author "app/llmcompare-bot" --json url,number --jq '.[0].url' 2>/dev/null || echo "")
          if [ -z "$PR_URL" ]; then
            echo "No open PR found, skipping auto-merge"
            exit 0
          fi
          PR_NUM=$(echo "$PR_URL" | grep -o '[0-9]*$')
          echo "Found PR #$PR_NUM: $PR_URL"

          # Approve
          gh pr review $PR_NUM --approve --body "🤖 Auto-approved by data-refresh workflow"
          echo "✅ Approved PR #$PR_NUM"

          # Merge (squash)
          gh pr merge $PR_NUM --squash --auto
          echo "✅ PR #$PR_NUM set to auto-merge"

      - name: Summary
        if: always()
        run: |
          echo "## 📊 Data Refresh Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Time:** $(date -u)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
